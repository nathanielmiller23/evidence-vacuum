# Evidence Vacuum: CUGA model settings. A copy of CUGA's stock settings.openai.toml with temperature 0 for every role.
# run_cuga.py copies this into tools/cuga-agent/src/cuga/configurations/models/ before importing cuga.
# The model comes from MODEL_NAME in .env (gpt-6-luna). Key: OPENAI_API_KEY.
#
# NOTE: CUGA drops `temperature` only for model names starting with o1/o3/o4/gpt-5 (models.py
# _is_reasoning_model). gpt-6-* is not on that list, so temperature=0 IS sent. If GPT-6 Luna rejects
# a non-default temperature, run harness/probe_openai.py and see the decisions log for the fix.

[agent.planner.model]
platform = "openai"
temperature = 0
max_tokens = 16000

[agent.chat.model]
platform = "openai"
temperature = 0
max_tokens = 16000

[agent.final_answer.model]
platform = "openai"
temperature = 0
max_tokens = 16000

[agent.code.model]
platform = "openai"
temperature = 0
max_tokens = 16000

[agent.qa.model]
platform = "openai"
temperature = 0
max_tokens = 16000

[agent.action.model]
platform = "openai"
temperature = 0
max_tokens = 400
