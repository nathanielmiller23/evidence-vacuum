version: '1.0'
name: ev-T114
description: Evidence Vacuum TRAINING scenario T114 (copperline, admin_patch, vb).
environment:
  description: Copperline Logistics
  domain: copperline.local
  timezone:
    default: UTC
  proxy:
    mode: explicit
    listener_port: 8080
  users:
  - username: dan.reyes
    full_name: Dan Reyes
    email: dan.reyes@copperline-log.com
    persona: project_manager
    primary_system: WS-DREYES-01
    groups:
    - staff
    enabled: true
    browsing_intensity: normal
  - username: kim.nguyen
    full_name: Kim Nguyen
    email: kim.nguyen@copperline-log.com
    persona: analyst
    primary_system: WS-KNGUYEN-01
    groups:
    - staff
    enabled: true
    browsing_intensity: light
  - username: paul.becker
    full_name: Paul Becker
    email: paul.becker@copperline-log.com
    persona: sysadmin
    primary_system: WS-PBECKER-01
    groups:
    - it-admins
    - domain-admins
    enabled: true
    browsing_intensity: light
  - username: sara.ali
    full_name: Sara Ali
    email: sara.ali@copperline-log.com
    persona: help_desk
    primary_system: WS-SALI-01
    groups:
    - staff
    enabled: true
    browsing_intensity: light
  service_accounts:
  - svc-backup
  - svc-routes
  systems:
  - hostname: WS-DREYES-01
    ip: 10.52.10.21
    os: Windows 11 Enterprise
    type: workstation
    assigned_user: dan.reyes
    services:
    - dns-client
    - termservice
  - hostname: WS-KNGUYEN-01
    ip: 10.52.10.22
    os: Windows 11 Enterprise
    type: workstation
    assigned_user: kim.nguyen
    services:
    - dns-client
    - termservice
  - hostname: WS-PBECKER-01
    ip: 10.52.10.23
    os: Windows 11 Enterprise
    type: workstation
    assigned_user: paul.becker
    services:
    - dns-client
    - termservice
  - hostname: WS-SALI-01
    ip: 10.52.10.24
    os: Windows 11 Enterprise
    type: workstation
    assigned_user: sara.ali
    services:
    - dns-client
    - termservice
  - hostname: DC-COP-01
    ip: 10.52.20.10
    os: Windows Server 2022
    type: domain_controller
    services:
    - kerberos
    - ldap
    - dns
    roles:
    - domain_controller
    - dns_server
  - hostname: FILE-COP-01
    ip: 10.52.20.20
    os: Windows Server 2022
    type: server
    services:
    - smb
    - dns-client
    roles:
    - file_server
  - hostname: PROXY-COP-01
    ip: 10.52.20.30
    os: Ubuntu 22.04 LTS
    type: server
    services:
    - squid
    - dns-client
    roles:
    - forward_proxy
  network:
    public_cidrs:
    - 198.51.100.48/28
    segments:
    - name: workstations
      cidr: 10.52.10.0/24
      exposure: internal
      systems:
      - WS-DREYES-01
      - WS-KNGUYEN-01
      - WS-PBECKER-01
      - WS-SALI-01
    - name: servers
      cidr: 10.52.20.0/24
      exposure: internal
      systems:
      - DC-COP-01
      - FILE-COP-01
      - PROXY-COP-01
    sensors:
    - type: network
      name: core-span
      hostname: ZEEK-CORE
      monitoring_segments:
      - workstations
      - servers
      direction: bidirectional
      placement: span
      log_formats:
      - zeek
time_window:
  start: '2026-09-15T13:00:00Z'
  duration: 2h
  warmup: 1h
generation_seed: 8114
baseline_activity:
  description: Quiet afternoon
  intensity: medium
  variation: low
  suspicious_noise: low
observation_profile: complete
storyline:
- id: adm
  time: +43m
  actor: paul.becker
  system: WS-DREYES-01
  activity: Admin network logon for patching
  events:
  - type: logon
    logon_type: 3
    source_ip: 10.52.10.23
- id: patch
  time: +45m
  actor: paul.becker
  system: WS-DREYES-01
  activity: Patch script runs; Windows Update download; wusa
  events:
  - type: process
    process_ref: ps
    process_name: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
    command_line: powershell.exe -NoProfile -ExecutionPolicy Bypass -File \\FILE-COP-01\IT\Patch-Workstations.ps1
  - type: connection
    dst_ip: 13.107.4.52
    dst_port: 443
    hostname: download.windowsupdate.com
    service: ssl
    orig_bytes: 2900
    resp_bytes: 38800000
  - type: process
    parent_ref: ps
    process_name: C:\Windows\System32\wusa.exe
    command_line: wusa.exe C:\Windows\Temp\patches\windows11-kb5047001-x64.msu /quiet /norestart
output:
  logs:
  - format: windows_event_security
  - format: windows_event_sysmon
  - format: zeek_conn
  - format: zeek_dns
  - format: zeek_ssl
  - format: proxy_access
  destination: out/T114
  compression: false
