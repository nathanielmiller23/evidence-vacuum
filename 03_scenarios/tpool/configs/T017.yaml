  proxy:
    mode: explicit
    listener_port: 8080
  users:
  - username: maria.lopez
    full_name: Maria Lopez
    email: maria.lopez@harbordental.com
    persona: accountant
    primary_system: WS-MLOPEZ-01
    groups:
    - staff
    enabled: true
    browsing_intensity: normal
  - username: ben.carter
    full_name: Ben Carter
    email: ben.carter@harbordental.com
    persona: analyst
    primary_system: WS-BCARTER-01
    groups:
    - staff
    enabled: true
    browsing_intensity: light
  - username: omar.haddad
    full_name: Omar Haddad
    email: omar.haddad@harbordental.com
    persona: sysadmin
    primary_system: WS-OHADDAD-01
    groups:
    - it-admins
    - domain-admins
    enabled: true
    browsing_intensity: light
  - username: lucy.park
    full_name: Lucy Park
    email: lucy.park@harbordental.com
    persona: help_desk
    primary_system: WS-LPARK-01
    groups:
    - staff
    enabled: true
    browsing_intensity: light
  service_accounts:
  - svc-bkp
  - svc-claimsync
  systems:
  - hostname: WS-MLOPEZ-01
    ip: 10.30.10.21
    os: Windows 11 Enterprise
    type: workstation
    assigned_user: maria.lopez
    services:
    - dns-client
    - termservice
  - hostname: WS-BCARTER-01
    ip: 10.30.10.22
    os: Windows 11 Enterprise
    type: workstation
    assigned_user: ben.carter
    services:
    - dns-client
    - termservice
  - hostname: WS-OHADDAD-01
    ip: 10.30.10.23
    os: Windows 11 Enterprise
    type: workstation
    assigned_user: omar.haddad
    services:
    - dns-client
    - termservice
  - hostname: WS-LPARK-01
    ip: 10.30.10.24
    os: Windows 11 Enterprise
    type: workstation
    assigned_user: lucy.park
    services:
    - dns-client
    - termservice
  - hostname: DC-HD-01
    ip: 10.30.20.10
    os: Windows Server 2022
    type: domain_controller
    services:
    - kerberos
    - ldap
    - dns
    roles:
    - domain_controller
    - dns_server
  - hostname: FILE-HD-01
    ip: 10.30.20.20
    os: Windows Server 2022
    type: server
    services:
    - smb
    - dns-client
    roles:
    - file_server
  - hostname: PROXY-HD-01
    ip: 10.30.20.30
    os: Ubuntu 22.04 LTS
    type: server
    services:
    - squid
    - dns-client
    roles:
    - forward_proxy
  network:
    public_cidrs:
    - 203.0.113.32/28
    segments:
    - name: workstations
      cidr: 10.30.10.0/24
      exposure: internal
      systems:
      - WS-MLOPEZ-01
      - WS-BCARTER-01
      - WS-OHADDAD-01
      - WS-LPARK-01
    - name: servers
      cidr: 10.30.20.0/24
      exposure: internal
      systems:
      - DC-HD-01
      - FILE-HD-01
      - PROXY-HD-01
    sensors:
    - type: network
      name: core-span
      hostname: ZEEK-CORE
      monitoring_segments:
      - workstations
      - servers
      direction: bidirectional
      placement: span
      log_formats:
      - zeek
time_window:
  start: '2026-10-20T13:00:00Z'
  duration: 2h
  warmup: 1h
generation_seed: 7017
baseline_activity:
  description: Quiet afternoon
  intensity: low
  variation: low
  suspicious_noise: low
observation_profile: complete
storyline:
- id: rdp
  time: +40m
  actor: omar.haddad
  system: WS-BCARTER-01
  activity: RDP from external IP
  events:
  - type: rdp_session
    source_ip: 192.0.2.45
- id: persist
  time: +44m
  actor: omar.haddad
  system: WS-BCARTER-01
  activity: Local admin + hidden PowerShell task
  events:
  - type: account_created
    target_username: it_helper
  - type: group_member_added
    group_name: Administrators
    member_name: it_helper
    scope: local
  - type: scheduled_task_created
    task_name: \Microsoft\Windows\HealthCheck
    task_content: powershell.exe -nop -w hidden -enc SQBFAFgAIAAoAGkAdwByACAAaAB0AHQAcAA6AC8ALwAxADkAMgAuADAALgAyAC4ANAA1AC8AYQAuAHAAcwAxACkA
output:
  logs:
  - format: windows_event_security
  - format: windows_event_sysmon
  - format: zeek_conn
  - format: zeek_dns
  - format: zeek_ssl
  - format: proxy_access
  destination: out/T017
  compression: false
