version: '1.0'
name: ev-T184
description: Evidence Vacuum TRAINING scenario T184 (bluefin, admin_patch, va).
environment:
  description: Bluefin Marine Supply
  domain: bluefin.local
  timezone:
    default: UTC
  proxy:
    mode: explicit
    listener_port: 8080
  users:
  - username: mia.santos
    full_name: Mia Santos
    email: mia.santos@bluefinmarine.com
    persona: sales
    primary_system: WS-MSANTOS-01
    groups:
    - staff
    enabled: true
    browsing_intensity: normal
  - username: eli.brooks
    full_name: Eli Brooks
    email: eli.brooks@bluefinmarine.com
    persona: sales
    primary_system: WS-EBROOKS-01
    groups:
    - staff
    enabled: true
    browsing_intensity: light
  - username: ken.ito
    full_name: Ken Ito
    email: ken.ito@bluefinmarine.com
    persona: sysadmin
    primary_system: WS-KITO-01
    groups:
    - it-admins
    - domain-admins
    enabled: true
    browsing_intensity: light
  - username: ruth.moss
    full_name: Ruth Moss
    email: ruth.moss@bluefinmarine.com
    persona: help_desk
    primary_system: WS-RMOSS-01
    groups:
    - staff
    enabled: true
    browsing_intensity: light
  service_accounts:
  - svc-arch
  - svc-inventory
  systems:
  - hostname: WS-MSANTOS-01
    ip: 10.54.10.21
    os: Windows 11 Enterprise
    type: workstation
    assigned_user: mia.santos
    services:
    - dns-client
    - termservice
  - hostname: WS-EBROOKS-01
    ip: 10.54.10.22
    os: Windows 11 Enterprise
    type: workstation
    assigned_user: eli.brooks
    services:
    - dns-client
    - termservice
  - hostname: WS-KITO-01
    ip: 10.54.10.23
    os: Windows 11 Enterprise
    type: workstation
    assigned_user: ken.ito
    services:
    - dns-client
    - termservice
  - hostname: WS-RMOSS-01
    ip: 10.54.10.24
    os: Windows 11 Enterprise
    type: workstation
    assigned_user: ruth.moss
    services:
    - dns-client
    - termservice
  - hostname: DC-BLU-01
    ip: 10.54.20.10
    os: Windows Server 2022
    type: domain_controller
    services:
    - kerberos
    - ldap
    - dns
    roles:
    - domain_controller
    - dns_server
  - hostname: FILE-BLU-01
    ip: 10.54.20.20
    os: Windows Server 2022
    type: server
    services:
    - smb
    - dns-client
    roles:
    - file_server
  - hostname: PROXY-BLU-01
    ip: 10.54.20.30
    os: Ubuntu 22.04 LTS
    type: server
    services:
    - squid
    - dns-client
    roles:
    - forward_proxy
  network:
    public_cidrs:
    - 192.0.2.96/28
    segments:
    - name: workstations
      cidr: 10.54.10.0/24
      exposure: internal
      systems:
      - WS-MSANTOS-01
      - WS-EBROOKS-01
      - WS-KITO-01
      - WS-RMOSS-01
    - name: servers
      cidr: 10.54.20.0/24
      exposure: internal
      systems:
      - DC-BLU-01
      - FILE-BLU-01
      - PROXY-BLU-01
    sensors:
    - type: network
      name: core-span
      hostname: ZEEK-CORE
      monitoring_segments:
      - workstations
      - servers
      direction: bidirectional
      placement: span
      log_formats:
      - zeek
time_window:
  start: '2026-09-29T13:00:00Z'
  duration: 2h
  warmup: 1h
generation_seed: 9184
baseline_activity:
  description: Quiet afternoon
  intensity: medium
  variation: low
  suspicious_noise: medium
observation_profile: complete
storyline:
- id: adm
  time: +41m
  actor: ken.ito
  system: WS-MSANTOS-01
  activity: Admin network logon for patching
  events:
  - type: logon
    logon_type: 3
    source_ip: 10.54.10.23
- id: patch
  time: +43m
  actor: ken.ito
  system: WS-MSANTOS-01
  activity: Patch script runs; Windows Update download; wusa
  events:
  - type: process
    process_ref: ps
    process_name: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
    command_line: powershell.exe -NoProfile -ExecutionPolicy Bypass -File \\FILE-BLU-01\IT\Patch-Workstations.ps1
  - type: connection
    dst_ip: 13.107.4.52
    dst_port: 443
    hostname: download.windowsupdate.com
    service: ssl
    orig_bytes: 2900
    resp_bytes: 38800000
  - type: process
    parent_ref: ps
    process_name: C:\Windows\System32\wusa.exe
    command_line: wusa.exe C:\Windows\Temp\patches\windows11-kb5047001-x64.msu /quiet /norestart
output:
  logs:
  - format: windows_event_security
  - format: windows_event_sysmon
  - format: zeek_conn
  - format: zeek_dns
  - format: zeek_ssl
  - format: proxy_access
  destination: out/T184
  compression: false
