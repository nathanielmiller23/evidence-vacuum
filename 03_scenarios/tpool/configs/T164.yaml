version: '1.0'
name: ev-T164
description: Evidence Vacuum TRAINING scenario T164 (maplehill, admin_patch, vc).
environment:
  description: Maple Hill Law Office
  domain: maplehill.local
  timezone:
    default: UTC
  proxy:
    mode: explicit
    listener_port: 8080
  users:
  - username: julia.frost
    full_name: Julia Frost
    email: julia.frost@maplehilllaw.com
    persona: legal_counsel
    primary_system: WS-JFROST-01
    groups:
    - staff
    enabled: true
    browsing_intensity: normal
  - username: noah.kim
    full_name: Noah Kim
    email: noah.kim@maplehilllaw.com
    persona: legal_counsel
    primary_system: WS-NKIM-01
    groups:
    - staff
    enabled: true
    browsing_intensity: light
  - username: ali.hassan
    full_name: Ali Hassan
    email: ali.hassan@maplehilllaw.com
    persona: sysadmin
    primary_system: WS-AHASSAN-01
    groups:
    - it-admins
    - domain-admins
    enabled: true
    browsing_intensity: light
  - username: greta.lund
    full_name: Greta Lund
    email: greta.lund@maplehilllaw.com
    persona: help_desk
    primary_system: WS-GLUND-01
    groups:
    - staff
    enabled: true
    browsing_intensity: light
  service_accounts:
  - svc-vault
  - svc-docsync
  systems:
  - hostname: WS-JFROST-01
    ip: 10.53.10.21
    os: Windows 11 Enterprise
    type: workstation
    assigned_user: julia.frost
    services:
    - dns-client
    - termservice
  - hostname: WS-NKIM-01
    ip: 10.53.10.22
    os: Windows 11 Enterprise
    type: workstation
    assigned_user: noah.kim
    services:
    - dns-client
    - termservice
  - hostname: WS-AHASSAN-01
    ip: 10.53.10.23
    os: Windows 11 Enterprise
    type: workstation
    assigned_user: ali.hassan
    services:
    - dns-client
    - termservice
  - hostname: WS-GLUND-01
    ip: 10.53.10.24
    os: Windows 11 Enterprise
    type: workstation
    assigned_user: greta.lund
    services:
    - dns-client
    - termservice
  - hostname: DC-MAP-01
    ip: 10.53.20.10
    os: Windows Server 2022
    type: domain_controller
    services:
    - kerberos
    - ldap
    - dns
    roles:
    - domain_controller
    - dns_server
  - hostname: FILE-MAP-01
    ip: 10.53.20.20
    os: Windows Server 2022
    type: server
    services:
    - smb
    - dns-client
    roles:
    - file_server
  - hostname: PROXY-MAP-01
    ip: 10.53.20.30
    os: Ubuntu 22.04 LTS
    type: server
    services:
    - squid
    - dns-client
    roles:
    - forward_proxy
  network:
    public_cidrs:
    - 203.0.113.64/28
    segments:
    - name: workstations
      cidr: 10.53.10.0/24
      exposure: internal
      systems:
      - WS-JFROST-01
      - WS-NKIM-01
      - WS-AHASSAN-01
      - WS-GLUND-01
    - name: servers
      cidr: 10.53.20.0/24
      exposure: internal
      systems:
      - DC-MAP-01
      - FILE-MAP-01
      - PROXY-MAP-01
    sensors:
    - type: network
      name: core-span
      hostname: ZEEK-CORE
      monitoring_segments:
      - workstations
      - servers
      direction: bidirectional
      placement: span
      log_formats:
      - zeek
time_window:
  start: '2026-09-22T13:00:00Z'
  duration: 2h
  warmup: 1h
generation_seed: 8164
baseline_activity:
  description: Quiet afternoon
  intensity: medium
  variation: low
  suspicious_noise: low
observation_profile: complete
storyline:
- id: adm
  time: +44m
  actor: ali.hassan
  system: WS-JFROST-01
  activity: Admin network logon for patching
  events:
  - type: logon
    logon_type: 3
    source_ip: 10.53.10.23
- id: patch
  time: +46m
  actor: ali.hassan
  system: WS-JFROST-01
  activity: Patch script runs; Windows Update download; wusa
  events:
  - type: process
    process_ref: ps
    process_name: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
    command_line: powershell.exe -NoProfile -ExecutionPolicy Bypass -File \\FILE-MAP-01\IT\Patch-Workstations.ps1
  - type: connection
    dst_ip: 13.107.4.52
    dst_port: 443
    hostname: download.windowsupdate.com
    service: ssl
    orig_bytes: 2900
    resp_bytes: 38800000
  - type: process
    parent_ref: ps
    process_name: C:\Windows\System32\wusa.exe
    command_line: wusa.exe C:\Windows\Temp\patches\windows11-kb5047001-x64.msu /quiet /norestart
output:
  logs:
  - format: windows_event_security
  - format: windows_event_sysmon
  - format: zeek_conn
  - format: zeek_dns
  - format: zeek_ssl
  - format: proxy_access
  destination: out/T164
  compression: false
