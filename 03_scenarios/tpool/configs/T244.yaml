version: '1.0'
name: ev-T244
description: Evidence Vacuum TRAINING scenario T244 (sunridge, admin_patch, vc).
environment:
  description: Sunridge Credit Union
  domain: sunridge.local
  timezone:
    default: UTC
  proxy:
    mode: explicit
    listener_port: 8080
  users:
  - username: zoe.adams
    full_name: Zoe Adams
    email: zoe.adams@sunridgecu.org
    persona: accountant
    primary_system: WS-ZADAMS-01
    groups:
    - staff
    enabled: true
    browsing_intensity: normal
  - username: max.fischer
    full_name: Max Fischer
    email: max.fischer@sunridgecu.org
    persona: analyst
    primary_system: WS-MFISCHER-01
    groups:
    - staff
    enabled: true
    browsing_intensity: light
  - username: ian.doyle
    full_name: Ian Doyle
    email: ian.doyle@sunridgecu.org
    persona: sysadmin
    primary_system: WS-IDOYLE-01
    groups:
    - it-admins
    - domain-admins
    enabled: true
    browsing_intensity: light
  - username: lena.ward
    full_name: Lena Ward
    email: lena.ward@sunridgecu.org
    persona: help_desk
    primary_system: WS-LWARD-01
    groups:
    - staff
    enabled: true
    browsing_intensity: light
  service_accounts:
  - svc-store
  - svc-ledger
  systems:
  - hostname: WS-ZADAMS-01
    ip: 10.55.10.21
    os: Windows 11 Enterprise
    type: workstation
    assigned_user: zoe.adams
    services:
    - dns-client
    - termservice
  - hostname: WS-MFISCHER-01
    ip: 10.55.10.22
    os: Windows 11 Enterprise
    type: workstation
    assigned_user: max.fischer
    services:
    - dns-client
    - termservice
  - hostname: WS-IDOYLE-01
    ip: 10.55.10.23
    os: Windows 11 Enterprise
    type: workstation
    assigned_user: ian.doyle
    services:
    - dns-client
    - termservice
  - hostname: WS-LWARD-01
    ip: 10.55.10.24
    os: Windows 11 Enterprise
    type: workstation
    assigned_user: lena.ward
    services:
    - dns-client
    - termservice
  - hostname: DC-SUN-01
    ip: 10.55.20.10
    os: Windows Server 2022
    type: domain_controller
    services:
    - kerberos
    - ldap
    - dns
    roles:
    - domain_controller
    - dns_server
  - hostname: FILE-SUN-01
    ip: 10.55.20.20
    os: Windows Server 2022
    type: server
    services:
    - smb
    - dns-client
    roles:
    - file_server
  - hostname: PROXY-SUN-01
    ip: 10.55.20.30
    os: Ubuntu 22.04 LTS
    type: server
    services:
    - squid
    - dns-client
    roles:
    - forward_proxy
  network:
    public_cidrs:
    - 198.51.100.112/28
    segments:
    - name: workstations
      cidr: 10.55.10.0/24
      exposure: internal
      systems:
      - WS-ZADAMS-01
      - WS-MFISCHER-01
      - WS-IDOYLE-01
      - WS-LWARD-01
    - name: servers
      cidr: 10.55.20.0/24
      exposure: internal
      systems:
      - DC-SUN-01
      - FILE-SUN-01
      - PROXY-SUN-01
    sensors:
    - type: network
      name: core-span
      hostname: ZEEK-CORE
      monitoring_segments:
      - workstations
      - servers
      direction: bidirectional
      placement: span
      log_formats:
      - zeek
time_window:
  start: '2026-10-06T13:00:00Z'
  duration: 2h
  warmup: 1h
generation_seed: 8244
baseline_activity:
  description: Quiet afternoon
  intensity: low
  variation: low
  suspicious_noise: low
observation_profile: complete
storyline:
- id: adm
  time: +41m
  actor: ian.doyle
  system: WS-ZADAMS-01
  activity: Admin network logon for patching
  events:
  - type: logon
    logon_type: 3
    source_ip: 10.55.10.23
- id: patch
  time: +43m
  actor: ian.doyle
  system: WS-ZADAMS-01
  activity: Patch script runs; Windows Update download; wusa
  events:
  - type: process
    process_ref: ps
    process_name: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
    command_line: powershell.exe -NoProfile -ExecutionPolicy Bypass -File \\FILE-SUN-01\IT\Patch-Workstations.ps1
  - type: connection
    dst_ip: 13.107.4.52
    dst_port: 443
    hostname: download.windowsupdate.com
    service: ssl
    orig_bytes: 2900
    resp_bytes: 38800000
  - type: process
    parent_ref: ps
    process_name: C:\Windows\System32\wusa.exe
    command_line: wusa.exe C:\Windows\Temp\patches\windows11-kb5047001-x64.msu /quiet /norestart
output:
  logs:
  - format: windows_event_security
  - format: windows_event_sysmon
  - format: zeek_conn
  - format: zeek_dns
  - format: zeek_ssl
  - format: proxy_access
  destination: out/T244
  compression: false
