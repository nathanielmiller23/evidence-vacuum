    dst_port: 443
    hostname: raw.githubusercontent.com
    service: ssl
    orig_bytes: 1300
    resp_bytes: 52000
  - type: process
    parent_ref: ps
    process_name: C:\Windows\System32\rundll32.exe
    command_line: rundll32.exe C:\Users\zoe.adams\AppData\Roaming\svchelper.dll,Init
